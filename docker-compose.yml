# =====================================================================
# docker-compose.yml : Phase 1 — infrastructure de la Smart Factory (1 usine)
# Services : mosquitto (MQTT), postgres (entrepôt), airflow (init + webserver + scheduler)
# FastAPI et le simulateur seront ajoutés en Phase 2.
# =====================================================================

name: smart_factory  # nom du projet Compose : préfixe des conteneurs, réseaux et volumes

# ---------------------------------------------------------------------
# Bloc réutilisable : configuration commune aux trois services Airflow
# ---------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11  # image officielle, version figée pour la reproductibilité
  user: "${AIRFLOW_UID:-50000}:0"  # utilisateur du conteneur (évite les problèmes de droits sur les volumes)
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor  # exécute les tâches en local (pas besoin de Celery ni Redis)
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"  # ne charge pas les DAG d'exemple
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}  # clé de session du webserver (depuis .env)
    # base de métadonnées d'Airflow : base "airflow" dans le même serveur PostgreSQL
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    # connexion Airflow "factory_db" vers l'entrepôt (utilisée par les DAG via PostgresHook)
    AIRFLOW_CONN_FACTORY_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  volumes:
    - ./airflow/dags:/opt/airflow/dags  # les DAG, modifiables sans reconstruire l'image
    - ./airflow/logs:/opt/airflow/logs  # journaux d'exécution
    - ./airflow/plugins:/opt/airflow/plugins  # opérateurs et plugins personnalisés
    - ./dbt:/opt/airflow/dbt  # projet DBT (Phase 3), visible depuis Airflow
  depends_on:
    postgres:
      condition: service_healthy  # attend que PostgreSQL accepte les connexions

services:
  # -------------------------------------------------------------------
  # 1) Mosquitto : broker MQTT qui reçoit les messages des machines
  # -------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18  # broker MQTT léger, version figée
    container_name: sf_mosquitto  # nom lisible du conteneur
    restart: unless-stopped  # redémarre sauf si arrêté à la main
    ports:
      - "1883:1883"  # port MQTT exposé sur ta machine (pour tester avec MQTT Explorer)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro  # configuration en lecture seule
      - mosquitto_data:/mosquitto/data  # persistance des messages retenus
    healthcheck:
      # s'abonne une fois au topic système pour vérifier que le broker répond
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s  # teste toutes les 10 secondes
      timeout: 5s  # abandonne un test après 5 secondes
      retries: 5  # 5 échecs de suite = unhealthy

  # -------------------------------------------------------------------
  # 2) PostgreSQL : entrepôt de données (schémas raw, ref, staging, marts, ml, odoo_sync)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine  # PostgreSQL 16, version légère
    container_name: sf_postgres  # nom lisible du conteneur
    restart: unless-stopped  # redémarrage automatique
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # super-utilisateur (depuis .env)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # son mot de passe (depuis .env)
      POSTGRES_DB: ${POSTGRES_DB}  # base créée au premier démarrage : factory_dw
      READONLY_PASSWORD: ${READONLY_PASSWORD}  # lu par le script 04_readonly_role.sh
    ports:
      - "5432:5432"  # accessible depuis ta machine (DBeaver, Power BI, psql)
    volumes:
      - pgdata:/var/lib/postgresql/data  # données persistantes
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro  # scripts exécutés UNE fois, par ordre alphabétique
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]  # PostgreSQL accepte-t-il les connexions ?
      interval: 5s  # teste toutes les 5 secondes
      timeout: 5s  # délai maximum d'un test
      retries: 10  # 10 échecs de suite = unhealthy

  # -------------------------------------------------------------------
  # 3) airflow-init : migre la base d'Airflow et crée l'administrateur (service ponctuel)
  # -------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common  # reprend la configuration commune
    container_name: sf_airflow_init  # nom lisible du conteneur
    restart: "no"  # s'arrête une fois le travail fini
    entrypoint: /bin/bash  # remplace l'entrypoint pour lancer nos commandes
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin --lastname Factory \
          --role Admin --email admin@smart-factory.local \
          || echo "Administrateur déjà existant : on continue")

  # -------------------------------------------------------------------
  # 4) airflow-webserver : interface web sur http://localhost:8080
  # -------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common  # configuration commune
    container_name: sf_airflow_web  # nom lisible du conteneur
    restart: unless-stopped  # redémarrage automatique
    command: webserver  # lance l'interface web
    ports:
      - "8080:8080"  # interface Airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully  # attend la fin de l'initialisation
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]  # l'interface répond-elle ?
      interval: 15s  # teste toutes les 15 secondes
      timeout: 10s  # délai maximum d'un test
      retries: 10  # 10 échecs de suite = unhealthy

  # -------------------------------------------------------------------
  # 5) airflow-scheduler : déclenche les DAG
  # -------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common  # configuration commune
    container_name: sf_airflow_scheduler  # nom lisible du conteneur
    restart: unless-stopped  # redémarrage automatique
    command: scheduler  # lance l'ordonnanceur
    depends_on:
      airflow-init:
        condition: service_completed_successfully  # attend la fin de l'initialisation

# ---------------------------------------------------------------------
# Volumes nommés : les données survivent à `docker compose down`
# ---------------------------------------------------------------------
volumes:
  pgdata:  # données PostgreSQL
  mosquitto_data:  # données Mosquitto
