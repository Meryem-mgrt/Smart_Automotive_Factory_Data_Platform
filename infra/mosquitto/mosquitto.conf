# =====================================================================
# mosquitto.conf : configuration du broker MQTT (DÉVELOPPEMENT uniquement)
# =====================================================================

# Active la sauvegarde sur disque des messages retenus
persistence true
# Dossier de persistance (monté sur le volume mosquitto_data)
persistence_location /mosquitto/data/

# Écoute sur le port MQTT standard, sur toutes les interfaces du conteneur
listener 1883 0.0.0.0

# Connexions anonymes autorisées : acceptable en local, à remplacer par password_file + ACL ensuite
allow_anonymous true

# Journaux envoyés sur la sortie standard (voir : docker compose logs mosquitto)
log_dest stdout
# Niveaux de journaux affichés
log_type error
log_type warning
log_type notice
